<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro - Warrior Arena</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    </head>
    <body class="pgn-cdt">
        <form class="cdt">
            <div class="logo">
                <a href="main.html">
                    <img src="wa.png" alt="Warrior Arena">
                </a>
            </div>
            <ul>
                <label for="Usuario">Nome de Usuário</label>
                <br>
                <input type="text" placeholder="Digite o seu nickname">
                <br><br>
                <label for="data">Data de Nascimento</label>
                <br>
                <input type="date" placeholder="Informe a sua data de nascimento">
                <br><br>
                <label for="email">Email</label>
                <br>
                <input type="email" placeholder="Digite o seu email">
                <br><br>
                <label for="Senha">Senha</label>
                <br>
                <input type="password" placeholder="Digite a sua senha">
            </ul>
            <div class="botoes">
                <button type="submit">Entrar</button>
                <button type="button" onclick="window.location.href='main.html'">Sair</button>
            </div>
            <p>
                Já possuí uma conta no nosso jogo? <a href="index.html">Clique Aqui</a>
            </p>
        </form>
    </body>
</html>
